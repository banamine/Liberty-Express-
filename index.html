<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express Player - M3U Loader</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        :root {
            --ground: #0f1419;
            --surface: #1a1f2e;
            --elevated: #242d3d;
            --accent: #00d9ff;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --border: #374151;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: 'Inter', sans-serif; background: var(--ground); color: var(--text-primary); overflow: hidden; }

        body { display: flex; flex-direction: column; }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: linear-gradient(to bottom, rgba(0, 217, 255, 0.08), transparent);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .logo { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .now-playing { font-size: 12px; color: var(--text-secondary); flex: 1; text-align: center; font-family: monospace; }

        .btn-menu {
            background: none;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .btn-menu:hover { background: var(--accent); color: var(--ground); }

        /* Player */
        .player-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }

        video { width: 100%; height: 100%; object-fit: contain; }

        /* Controls */
        .controls-bar {
            background: var(--surface);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .progress {
            width: 100%;
            height: 4px;
            background: var(--border);
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
        }

        .btn-ctrl {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 18px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.15s;
        }
        .btn-ctrl:hover { color: var(--accent); background: var(--elevated); }

        .time-info { font-size: 12px; font-family: monospace; color: var(--text-secondary); min-width: 100px; }

        /* Menu */
        .menu-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 99;
        }
        .menu-backdrop.open { opacity: 1; pointer-events: auto; }

        .menu {
            position: fixed;
            top: 0;
            right: -380px;
            width: 380px;
            height: 100%;
            background: var(--surface);
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.3);
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }
        .menu.open { right: 0; }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .menu-title { font-size: 14px; font-weight: 700; text-transform: uppercase; color: var(--accent); letter-spacing: 0.5px; }

        .btn-close {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 24px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border);
            padding: 0 8px;
        }

        .tab-btn {
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            padding: 12px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        .upload-area {
            padding: 20px;
            border: 2px dashed var(--border);
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            margin: 12px;
            transition: all 0.2s;
        }
        .upload-area:hover { border-color: var(--accent); background: rgba(0, 217, 255, 0.05); }

        .upload-area-text { font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
        .upload-area-hint { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .channel-list::-webkit-scrollbar { width: 6px; }
        .channel-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .channel-item {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
        }
        .channel-item:hover {
            background: var(--elevated);
            border-left: 3px solid var(--accent);
            padding-left: 9px;
        }
        .channel-item.active {
            background: rgba(0, 217, 255, 0.1);
            border-left: 3px solid var(--accent);
            padding-left: 9px;
        }

        .channel-number {
            font-size: 10px;
            font-weight: 700;
            font-family: monospace;
            color: var(--accent);
            background: var(--elevated);
            padding: 2px 6px;
            border-radius: 3px;
            min-width: 28px;
            text-align: center;
        }

        .channel-info { flex: 1; min-width: 0; }
        .channel-name { font-size: 12px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-url { font-size: 10px; font-family: monospace; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .empty-msg {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 300px;
            gap: 12px;
            padding: 40px;
            text-align: center;
            color: var(--text-secondary);
        }

        .empty-icon { font-size: 40px; opacity: 0.5; }
        .empty-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }

        input[type="file"] { display: none; }
        .hidden { display: none !important; }

        .search-box {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .search-box input {
            width: 100%;
            background: var(--elevated);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
        }

        .search-box input:focus { outline: none; border-color: var(--accent); }

        @media (max-width: 600px) {
            .menu { width: 100%; right: -100%; }
            .time-info { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">▶ Express Player</div>
        <div class="now-playing" id="nowPlaying">Select a stream</div>
        <button class="btn-menu" id="menuBtn">Menu</button>
    </header>

    <div class="player-area">
        <video id="player"></video>
    </div>

    <div class="controls-bar">
        <div class="progress">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="controls">
            <div style="display: flex; gap: 8px;">
                <button class="btn-ctrl" id="playBtn" title="Play/Pause">▶</button>
                <button class="btn-ctrl" id="muteBtn" title="Mute">🔊</button>
            </div>
            <div class="time-info">
                <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
            </div>
            <button class="btn-ctrl" id="fsBtn" title="Fullscreen">⛶</button>
        </div>
    </div>

    <div class="menu-backdrop" id="backdrop"></div>
    <div class="menu" id="menu">
        <div class="menu-header">
            <h2 class="menu-title">Load Playlists</h2>
            <button class="btn-close" id="closeBtn">✕</button>
        </div>

        <div class="menu-tabs">
            <button class="tab-btn active" data-tab="files">Playlists</button>
            <button class="tab-btn" data-tab="channels">Channels</button>
        </div>

        <div id="filesTab">
            <div class="upload-area" id="uploadArea">
                <div style="font-size: 32px;">📁</div>
                <div class="upload-area-text">Drop M3U files here or click to upload</div>
                <div class="upload-area-hint">.m3u, .m3u8 files supported</div>
                <input type="file" id="fileInput" multiple accept=".m3u,.m3u8,text/plain">
            </div>
            <ul class="channel-list" id="playlistList"></ul>
        </div>

        <div id="channelsTab" class="hidden">
            <div class="search-box">
                <input type="text" id="searchBox" placeholder="Search channels...">
            </div>
            <ul class="channel-list" id="channelList"></ul>
        </div>
    </div>

    <script>
        class ExpressPlayer {
            constructor() {
                this.video = document.getElementById('player');
                this.playBtn = document.getElementById('playBtn');
                this.muteBtn = document.getElementById('muteBtn');
                this.fsBtn = document.getElementById('fsBtn');
                this.progressFill = document.getElementById('progressFill');
                this.currentTimeEl = document.getElementById('currentTime');
                this.durationEl = document.getElementById('duration');
                this.nowPlayingEl = document.getElementById('nowPlaying');
                this.menuBtn = document.getElementById('menuBtn');
                this.closeBtn = document.getElementById('closeBtn');
                this.backdrop = document.getElementById('backdrop');
                this.menu = document.getElementById('menu');
                this.uploadArea = document.getElementById('uploadArea');
                this.fileInput = document.getElementById('fileInput');
                this.playlistList = document.getElementById('playlistList');
                this.channelList = document.getElementById('channelList');
                this.searchBox = document.getElementById('searchBox');
                this.progress = document.querySelector('.progress');

                this.playlists = [];
                this.allChannels = [];
                this.filteredChannels = [];
                this.currentPlaylist = null;

                this.init();
            }

            init() {
                this.setupEventListeners();
                this.loadSampleData();
                this.renderPlaylists();
            }

            setupEventListeners() {
                this.menuBtn.addEventListener('click', () => this.openMenu());
                this.closeBtn.addEventListener('click', () => this.closeMenu());
                this.backdrop.addEventListener('click', () => this.closeMenu());

                document.querySelectorAll('[data-tab]').forEach(btn => {
                    btn.addEventListener('click', (e) => this.switchTab(e.target.dataset.tab));
                });

                this.uploadArea.addEventListener('click', () => this.fileInput.click());
                this.uploadArea.addEventListener('dragover', (e) => e.preventDefault());
                this.uploadArea.addEventListener('drop', (e) => this.handleDrop(e));
                this.fileInput.addEventListener('change', (e) => this.handleFiles(e));

                this.playBtn.addEventListener('click', () => this.togglePlay());
                this.muteBtn.addEventListener('click', () => this.toggleMute());
                this.fsBtn.addEventListener('click', () => this.toggleFullscreen());
                this.progress.addEventListener('click', (e) => this.seek(e));
                this.searchBox.addEventListener('input', (e) => this.filterChannels(e.target.value));

                this.video.addEventListener('play', () => this.updatePlayBtn());
                this.video.addEventListener('pause', () => this.updatePlayBtn());
                this.video.addEventListener('timeupdate', () => this.updateProgress());
                this.video.addEventListener('durationchange', () => this.updateDuration());

                document.addEventListener('keydown', (e) => this.handleKeys(e));
            }

            loadSampleData() {
                this.playlists = [
                    {
                        name: 'Sample Movies',
                        channels: [
                            { name: 'Big Buck Bunny', url: 'https://commondatastorage.googleapis.com/gtv-videos-library/sample/BigBuckBunny.mp4' },
                            { name: 'Elephants Dream', url: 'https://commondatastorage.googleapis.com/gtv-videos-library/sample/ElephantsDream.mp4' }
                        ]
                    }
                ];
                this.rebuildChannels();
            }

            rebuildChannels() {
                this.allChannels = [];
                this.playlists.forEach(pl => this.allChannels.push(...pl.channels));
                this.filteredChannels = [...this.allChannels];
            }

            renderPlaylists() {
                this.playlistList.innerHTML = '';
                if (this.playlists.length === 0) {
                    this.playlistList.innerHTML = '<div class="empty-msg"><div class="empty-icon">📂</div><div class="empty-title">No playlists</div></div>';
                    return;
                }

                this.playlists.forEach(pl => {
                    const li = document.createElement('li');
                    li.className = 'channel-item' + (pl === this.currentPlaylist ? ' active' : '');
                    li.innerHTML = `<div style="flex: 1;"><div class="channel-name">${pl.name}</div><div class="channel-url">${pl.channels.length} channels</div></div>`;
                    li.addEventListener('click', () => this.selectPlaylist(pl));
                    this.playlistList.appendChild(li);
                });
            }

            renderChannels() {
                this.channelList.innerHTML = '';
                const channels = this.filteredChannels;

                if (channels.length === 0) {
                    this.channelList.innerHTML = '<div class="empty-msg"><div class="empty-icon">📺</div><div class="empty-title">No channels</div></div>';
                    return;
                }

                channels.forEach((ch, idx) => {
                    const li = document.createElement('li');
                    li.className = 'channel-item';
                    li.innerHTML = `
                        <div class="channel-number">${idx + 1}</div>
                        <div class="channel-info">
                            <div class="channel-name">${ch.name}</div>
                            <div class="channel-url">${ch.url.substring(0, 45)}...</div>
                        </div>
                    `;
                    li.addEventListener('click', () => this.playChannel(ch));
                    this.channelList.appendChild(li);
                });
            }

            handleDrop(e) {
                e.preventDefault();
                Array.from(e.dataTransfer.files).forEach(f => this.readFile(f));
            }

            handleFiles(e) {
                Array.from(e.target.files).forEach(f => this.readFile(f));
                this.fileInput.value = '';
            }

            readFile(file) {
                if (!file.name.match(/\.(m3u|m3u8)$/i)) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const pl = this.parseM3U(file.name, e.target.result);
                    this.playlists.push(pl);
                    this.rebuildChannels();
                    this.renderPlaylists();
                    this.renderChannels();
                };
                reader.readAsText(file);
            }

            parseM3U(filename, content) {
                const channels = [];
                let title = '';
                content.split('\n').forEach(line => {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        const match = line.match(/,(.+)$/);
                        title = match ? match[1] : 'Unknown';
                    } else if (line && !line.startsWith('#') && title) {
                        channels.push({ name: title, url: line });
                        title = '';
                    }
                });
                return { name: filename.replace(/\.(m3u|m3u8)$/i, ''), channels };
            }

            selectPlaylist(pl) {
                this.currentPlaylist = pl;
                this.filteredChannels = [...pl.channels];
                this.switchTab('channels');
                this.renderPlaylists();
                this.renderChannels();
            }

            filterChannels(q) {
                const channels = this.currentPlaylist ? this.currentPlaylist.channels : this.allChannels;
                this.filteredChannels = channels.filter(ch =>
                    ch.name.toLowerCase().includes(q.toLowerCase()) ||
                    ch.url.toLowerCase().includes(q.toLowerCase())
                );
                this.renderChannels();
            }

            playChannel(ch) {
                this.nowPlayingEl.textContent = ch.name;
                this.video.src = ch.url;
                this.video.play().catch(e => console.error('Play error:', e));
                this.closeMenu();
                this.updatePlayBtn();
            }

            switchTab(tab) {
                document.querySelectorAll('[data-tab]').forEach(t => t.classList.remove('active'));
                event.target.classList.add('active');
                document.getElementById('filesTab').classList.toggle('hidden', tab !== 'files');
                document.getElementById('channelsTab').classList.toggle('hidden', tab !== 'channels');
                if (tab === 'channels') this.searchBox.focus();
            }

            openMenu() {
                this.menu.classList.add('open');
                this.backdrop.classList.add('open');
            }

            closeMenu() {
                this.menu.classList.remove('open');
                this.backdrop.classList.remove('open');
            }

            togglePlay() {
                if (!this.video.src) { this.openMenu(); return; }
                this.video.paused ? this.video.play() : this.video.pause();
            }

            updatePlayBtn() {
                this.playBtn.textContent = this.video.paused ? '▶' : '⏸';
            }

            toggleMute() {
                this.video.muted = !this.video.muted;
                this.muteBtn.textContent = this.video.muted ? '🔇' : '🔊';
            }

            updateProgress() {
                if (this.video.duration) {
                    this.progressFill.style.width = (this.video.currentTime / this.video.duration * 100) + '%';
                    this.currentTimeEl.textContent = this.formatTime(this.video.currentTime);
                }
            }

            updateDuration() {
                this.durationEl.textContent = this.formatTime(this.video.duration);
            }

            formatTime(s) {
                if (!s || isNaN(s)) return '0:00';
                const h = Math.floor(s / 3600);
                const m = Math.floor((s % 3600) / 60);
                const sec = Math.floor(s % 60);
                return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
            }

            seek(e) {
                if (!this.video.duration) return;
                const rect = this.progress.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                this.video.currentTime = percent * this.video.duration;
            }

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(e => console.error('FS error:', e));
                } else {
                    document.exitFullscreen();
                }
            }

            handleKeys(e) {
                if (this.menu.classList.contains('open')) return;
                if (e.key === ' ') { e.preventDefault(); this.togglePlay(); }
                if (e.key.toLowerCase() === 'm') this.toggleMute();
                if (e.key.toLowerCase() === 'f') this.toggleFullscreen();
            }
        }

        document.addEventListener('DOMContentLoaded', () => new ExpressPlayer());
    </script>
</body>
</html>
