<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="IPTV Player powered by Liberty">
    <meta name="theme-color" content="#1e90ff">
    <title>Web IPTV Player | Watch your Favorites TV channels!</title>
    <base href="./">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://png.pngtree.com/png-vector/20240827/ourlarge/pngtree-vintage-old-television-isolated-on-transparent-background-png-image_13645075.png">
    <link rel="shortcut icon" href="https://png.pngtree.com/png-vector/20240827/ourlarge/pngtree-vintage-old-television-isolated-on-transparent-background-png-image_13645075.png">
    <link rel="apple-touch-icon" href="https://png.pngtree.com/png-vector/20240827/ourlarge/pngtree-vintage-old-television-isolated-on-transparent-background-png-image_13645075.png">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/dashjs@4.7.2/dist/dash.all.min.js">
    </script>
    <style>
        :root {
            --primary: #1e90ff;
            --secondary: #ff2970;
            --accent: #00ffcc;
            --background: #121212;
            --surface: #181c24;
            --text: #e0e0e0;
            --text-light: #f5f6fa;
            --border: #232730;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --info: #17a2b8;
            --radius: 14px;
            --shadow: 0 4px 40px 0 rgba(0, 0, 0, 0.11);
            --glow: 0 0 10px currentColor;
            --transition: all 0.3s ease;
        }

        body.light {
            --background: #f7f9fa;
            --surface: #f9fafb;
            --text: #222;
            --text-light: #232323;
            --border: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family: 'Segoe UI', 'Inter', Arial, sans-serif;
            transition: var(--transition);
            overflow: auto;
            min-height: 100vh;
            width: 100%;
            -webkit-overflow-scrolling: touch;
        }

        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        #player {
            width: 100%;
            height: 60vh;
            max-height: 80vh;
            object-fit: cover;
            position: relative;
            top: 0;
            left: 0;
            z-index: 1;
            background: #000;
        }

        .player-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .container:hover .player-controls {
            opacity: 1;
        }

        .control-btn {
            background: rgba(32, 32, 48, 0.85);
            color: var(--text-light);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .control-btn:hover {
            background: rgba(37, 99, 235, 0.8);
            box-shadow: var(--glow);
        }

        .fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 340px;
            height: 100vh;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            border-radius: var(--radius) 0 0 var(--radius);
            box-shadow: var(--shadow);
            z-index: 22;
            border-left: 1.5px solid var(--border);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .sidebar.hidden {
            transform: translateX(110%);
            box-shadow: none;
        }

        .sidebar-content {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .sidebar-footer {
            flex-shrink: 0;
            background: transparent;
            width: 100%;
            font-size: 0.92rem;
            text-align: center;
            color: var(--text);
            border-top: 1px solid var(--border);
            padding: 10px 0;
        }

        .sidebar-toggle,
        .theme-toggle-btn {
            position: fixed;
            top: 6px;
            z-index: 41;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: var(--surface);
            color: var(--text);
            border-radius: 50%;
            font-size: 1.25rem;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .theme-toggle-btn {
            right: 78px;
        }
        .sidebar-toggle {
            right: 24px;
        }

        .sidebar-toggle:hover,
        .theme-toggle-btn:hover {
            background: var(--primary);
            color: #fff;
            box-shadow: var(--glow);
        }

        .localtime-bar {
            position: fixed;
            top: 10px;
            left: 18px;
            z-index: 100;
            background: rgba(25, 28, 36, 0.90);
            color: var(--text-light);
            font-size: 1.03rem;
            font-family: inherit;
            font-weight: 600;
            letter-spacing: 0.01em;
            padding: 5px 14px 4px 14px;
            border-radius: 23px;
            box-shadow: 0 1px 7px 0 rgba(0, 0, 0, 0.10);
            user-select: none;
            min-width: 120px;
            text-align: center;
            pointer-events: none;
        }

        body.light .localtime-bar {
            background: #e5e7eb;
            color: #222;
        }

        .upload-panel,
        .search-panel {
            padding: 13px 18px 0 18px;
            background: transparent;
        }

        .upload-panel h3 {
            font-size: 1.08rem;
            margin: 0 0 8px 0;
            font-weight: 600;
            color: var(--primary);
        }

        .upload-panel input[type="file"] {
            width: 90%;
            padding: 10px 13px;
            margin: 6px 0px 6px 0px;
            background: var(--surface);
            color: var(--text);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .url-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #urlInput {
            flex: 1 1 0px;
            padding: 10px 13px;
            background: var(--surface);
            color: var(--text);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }

        #loadUrl {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 50%;
            padding: 0;
            width: 40px;
            height: 40px;
            min-width: 40px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0;
            margin-left: 4px;
            font-size: 1.1rem;
            transition: var(--transition);
            cursor: pointer;
        }

        #loadUrl:hover {
            background: #1e40af;
            box-shadow: var(--glow);
        }

        .search-panel input[type="text"] {
            width: 90%;
            padding: 10px 13px;
            margin-bottom: 4px;
            background: var(--surface);
            color: var(--text);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .tabs {
            display: flex;
            border-bottom: 1.5px solid var(--border);
            margin: 5px 0 0 0;
            padding: 0 10px;
        }

        .tab {
            flex: 1;
            padding: 10px 0 7px 0;
            text-align: center;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1.08rem;
            font-weight: 500;
            color: #b3b6c9;
            transition: var(--transition);
            border-bottom: 3px solid transparent;
            border-radius: 8px 8px 0 0;
        }

        .tab.active {
            color: var(--primary);
            background: var(--surface);
            border-bottom: 3px solid var(--primary);
        }

        .tab:hover:not(.active) {
            background: var(--border);
            color: var(--text-light);
        }

        .tab-content {
            display: none;
            flex: 1 1 auto;
            flex-direction: column;
            min-height: 0;
            padding: 0 7px;
            height: 0;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: none;
        }

        .channel-list,
        .history-list,
        .favorites-list {
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            min-height: 44px;
            max-height: 100%;
            -webkit-overflow-scrolling: touch;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            gap: 10px;
        }

        .pagination button {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 5px 10px;
            cursor: pointer;
            transition: var(--transition);
        }

        .pagination button:hover {
            background: var(--primary);
            color: #fff;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .channel-item,
        .favorite-item,
        .history-item {
            width: 100%;
            padding: 10px;
            margin-bottom: 4px;
            background: var(--surface);
            color: var(--text-light);
            border: none;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            font-size: 1.01rem;
            box-shadow: 0 1px 4px 0 rgba(0, 0, 0, 0.06);
            letter-spacing: 0.01em;
            transition: var(--transition);
        }

        .channel-item:hover,
        .favorite-item:hover,
        .history-item:hover {
            background: var(--border);
            color: var(--text-light);
            box-shadow: 0 2px 12px 0 rgba(37, 99, 235, 0.10);
        }

        .channel-item img,
        .favorite-item img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            border-radius: 7px;
            background: var(--text-light);
        }

        .default-logo {
            background: #f2f2f2;
        }

        .channel-item .favorite-btn,
        .favorite-item .favorite-btn {
            margin-left: auto;
            cursor: pointer;
            z-index: 2;
            transition: var(--transition);
        }

        .playlist-current {
            border: 2px solid var(--primary) !important;
            background: #1e293b !important;
            color: #fff !important;
            box-shadow: 0 3px 20px 0 rgba(37, 99, 235, 0.13);
        }

        .playlist-favorite {
            background: #202c2b !important;
            color: var(--secondary) !important;
        }

        .playlist-current .favorite-btn,
        .playlist-favorite .favorite-btn {
            color: var(--secondary) !important;
        }

        .playlist-current.playlist-favorite {
            background: linear-gradient(90deg, var(--primary) 60%, var(--secondary) 100%) !important;
            color: #fff !important;
        }

        .history-item .history-label {
            flex: 1 1 0px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: block;
        }

        .history-item .action-btn,
        .history-item .delete-btn {
            margin-left: 7px;
            cursor: pointer;
            z-index: 2;
            opacity: 0.85;
            transition: opacity 0.15s;
        }

        .history-item .action-btn:hover,
        .history-item .delete-btn:hover {
            opacity: 1;
        }

        .analysis-panel {
            text-align: center;
            margin: 0 0 8px 0;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
        }

        .analysis-panel h3 {
            font-size: 1.10rem;
            font-weight: 600;
            margin: 10px 0 7px 0;
            color: var(--primary);
        }

        .analysis-panel .analysis-buttons {
            margin: 9px 0 3px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .analysis-panel .analysis-buttons button {
            background: var(--surface);
            color: var(--text);
            border: none;
            border-radius: 7px;
            padding: 6px 16px;
            font-size: 0.98rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .analysis-panel .analysis-buttons button.active {
            background: var(--primary);
            color: #fff;
        }

        .analysis-panel .analysis-buttons button#showTotal {
            background: var(--primary);
        }
        .analysis-panel .analysis-buttons button#showOnline {
            background: var(--success);
        }
        .analysis-panel .analysis-buttons button#showOffline {
            background: var(--danger);
        }

        .manual-check-btn {
            background: var(--surface);
            color: var(--primary);
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.28rem;
            box-shadow: 0 1px 6px 0 rgba(0, 0, 0, 0.06);
            margin-left: 8px;
            vertical-align: middle;
            transition: var(--transition);
        }

        .manual-check-btn:hover {
            background: var(--primary);
            color: #fff;
            box-shadow: var(--glow);
        }

        .analysis-panel .analysis-status-summary {
            margin: 10px 0 0 0;
            font-size: 1.07em;
            font-weight: 600;
            cursor: pointer;
        }

        .analysis-panel canvas {
            max-width: 100%;
            margin: 8px auto 0 auto;
        }

        .player-notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(32, 32, 48, 0.95);
            color: #fff;
            font-size: 1.18rem;
            font-weight: 500;
            border-radius: 14px;
            padding: 22px 36px 22px 36px;
            z-index: 1000;
            text-align: center;
            box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.23);
            min-width: 220px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .player-notification.show {
            opacity: 1;
            pointer-events: auto;
        }

        .player-notification .spinner {
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        .popup-menu {
            position: absolute;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            z-index: 100;
            display: none;
            flex-direction: column;
            min-width: 150px;
            padding: 5px 0;
        }

        .popup-menu button {
            background: none;
            border: none;
            padding: 8px 15px;
            text-align: left;
            cursor: pointer;
            color: var(--text);
            transition: var(--transition);
        }

        .popup-menu button:hover {
            background: var(--primary);
            color: #fff;
        }

        .context-menu {
            display: none;
            position: fixed;
            z-index: 1000;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 5px 0;
        }

        .context-menu button {
            display: block;
            width: 100%;
            padding: 8px 15px;
            background: none;
            border: none;
            text-align: left;
            cursor: pointer;
            color: var(--text);
            transition: var(--transition);
        }

        .context-menu button:hover {
            background: var(--primary);
            color: #fff;
        }

        .history-list-bar {
            display: flex;
            justify-content: center;
            padding: 8px 0;
        }

        .history-list-bar button {
            background: var(--danger);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 6px 16px;
            cursor: pointer;
            transition: var(--transition);
        }

        .history-list-bar button:hover {
            opacity: 0.85;
        }

        .text-red {
            color: var(--secondary);
        }

        .playlist-bar {
            width: 100%;
            text-align: center;
            font-weight: 600;
            padding: 8px 0;
            background: rgba(37, 99, 235, 0.08);
            color: #2563eb;
            border-bottom: 1.5px solid #2563eb;
        }

        @media (max-width: 1024px) {
            .sidebar {
                width: 96vw;
                max-width: 370px;
                border-radius: var(--radius) 0 0 var(--radius);
            }
            .sidebar-footer {
                width: 100vw;
                max-width: 370px;
            }
            .sidebar-toggle,
            .theme-toggle-btn {
                right: 0;
            }
            #player {
                height: 45vh;
            }
        }

        @media (max-width: 650px) {
            .sidebar {
                width: 100vw;
                max-width: 100vw;
                border-radius: 0;
            }
            .sidebar-footer {
                width: 100vw;
                max-width: 100vw;
                border-radius: 0;
            }
            .sidebar-toggle,
            .theme-toggle-btn {
                right: 0;
            }
            #player {
                height: 38vh;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Time bar -->
        <div class="localtime-bar" id="localTime"></div>

        <!-- Video player -->
        <video id="player" controls autoplay playsinline muted poster="https://www.liberty-express.org/uploads/1/4/4/3/144388675/liberty-desk-2_orig.jpg"></video>

        <!-- Player overlay controls -->
        <div class="player-controls">
            <button class="control-btn" id="prevChannel" title="Previous Channel"><i class="fas fa-backward"></i></button>
            <button class="control-btn" id="playPause" title="Play/Pause"><i class="fas fa-play"></i></button>
            <button class="control-btn" id="nextChannel" title="Next Channel"><i class="fas fa-forward"></i></button>
            <button class="control-btn" id="volumeUp" title="Volume Up"><i class="fas fa-volume-up"></i></button>
            <button class="control-btn" id="volumeDown" title="Volume Down"><i class="fas fa-volume-down"></i></button>
        </div>

        <!-- Fullscreen button -->
        <button class="control-btn fullscreen-btn" id="fullscreenBtn" title="Fullscreen"><i class="fas fa-expand"></i></button>

        <!-- Theme & Sidebar toggles -->
        <button id="toggleTheme" class="theme-toggle-btn" title="Toggle theme"><i class="fas fa-moon"></i></button>
        <button id="toggleSidebar" class="sidebar-toggle" title="Toggle sidebar"><i class="fas fa-bars"></i></button>

        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-content">

                <!-- Upload panel -->
                <div class="upload-panel">
                    <h3>Upload Playlist or URL</h3>
                    <input type="file" id="fileInput" accept=".m3u,.json,.txt">
                    <div class="url-row">
                        <input type="text" id="urlInput" placeholder="Enter stream URL">
                        <button id="loadUrl" title="Load Stream"><i class="fas fa-play"></i></button>
                    </div>
                </div>

                <!-- Search panel -->
                <div class="search-panel">
                    <input type="text" id="searchInput" placeholder="Search channels...">
                </div>

                <!-- Tabs -->
                <div class="tabs">
                    <div class="tab active" data-tab="channels"><i class="fas fa-tv"></i></div>
                    <div class="tab" data-tab="history"><i class="fas fa-clock"></i></div>
                    <div class="tab" data-tab="favorites"><i class="fas fa-heart"></i></div>
                    <div class="tab" data-tab="analysis"><i class="fas fa-chart-bar"></i></div>
                </div>

                <!-- Channels tab -->
                <div class="tab-content active" id="channels-tab">
                    <div class="playlist-bar" id="playlistBar">Playlist: Default Playlist</div>
                    <div class="channel-list" id="channelList"></div>
                    <div class="pagination" id="channelPagination">
                        <button id="prevPage"><i class="fas fa-chevron-left"></i></button>
                        <span id="pageInfo">Page 1 of 1</span>
                        <button id="nextPage"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>

                <!-- History tab -->
                <div class="tab-content" id="history-tab">
                    <div class="history-list" id="historyList"></div>
                </div>

                <!-- Favorites tab -->
                <div class="tab-content" id="favorites-tab">
                    <div class="favorites-list" id="favoritesList"></div>
                    <div class="pagination" id="favoritesPagination">
                        <button id="prevFavPage"><i class="fas fa-chevron-left"></i></button>
                        <span id="favPageInfo">Page 1 of 1</span>
                        <button id="nextFavPage"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>

                <!-- Analysis tab -->
                <div class="tab-content" id="analysis-tab">
                    <div class="analysis-panel">
                        <h3>Playlist Analysis
                            <button id="manualCheckBtn" class="manual-check-btn" title="Manual check"><i class="fas fa-check-circle"></i></button>
                        </h3>
                        <div class="analysis-buttons">
                            <button id="showTotal" class="tab-analysis-btn active">Total</button>
                            <button id="showOnline" class="tab-analysis-btn">Online</button>
                            <button id="showOffline" class="tab-analysis-btn">Offline</button>
                        </div>
                        <div class="analysis-status-summary" id="analysisStatusSummary">
                            <span id="analysisText">Total: 0 | Online: 0 | Offline: 0</span>
                        </div>
                        <canvas id="analysisChart" width="200" height="200"></canvas>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="sidebar-footer" id="sidebarFooter"></div>
        </div>

        <!-- Context menu -->
        <div class="context-menu" id="contextMenu">
            <button id="contextPlay">Play Channel</button>
            <button id="contextFavorite">Add to Favorites</button>
            <button id="contextInfo">Channel Info</button>
        </div>

        <!-- Notification overlay (created dynamically) -->
    </div>

    <script>
        /* ============================================================
           PROJECT RESILIENCE — Full Rebuild
           Fixes: HLS lifecycle, XSS, health checks, scroll, fullscreen sync
           ============================================================ */

        // ─── CONSTANTS ────────────────────────────────────────────────
        const DEFAULT_PLAYLIST = `#EXTM3U
        #EXTINF:-1,Amagi Channel 1
        https://amg01117-amg01117c1-amgplt0165.playout.now3.amagi.tv/playlist.m3u8
        #EXTINF:-1,21 Jump Street

            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ─── UTILITY: SAFE TEXT NODE ────────────────────────────────
        function safeText(str) {
            return document.createTextNode(str);
        }

        // ─── UTILITY: SHORTEN URL ────────────────────────────────────
        function shortenUrl(url) {
            try {
                const u = new URL(url);
                let host = u.host.replace(/^www\./, '');
                let path = u.pathname.length > 20 ? u.pathname.slice(0, 16) + '…' : u.pathname;
                return host + path;
            } catch {
                return url.length > 24 ? url.slice(0, 20) + '…' : url;
            }
        }

        // ─── HLS LIFECYCLE (Phase 1) ─────────────────────────────────
        function destroyHls() {
            if (hlsInstance) {
                try {
                    hlsInstance.destroy();
                } catch (_) { /* ignore */ }
                hlsInstance = null;
            }
            if (dashPlayer) {
                try {
                    dashPlayer.reset();
                } catch (_) { /* ignore */ }
                dashPlayer = null;
            }
            // Detach any media error handlers
            player.oncanplay = null;
            player.onerror = null;
        }

        // ─── PLAY STREAM (with HLS lifecycle & error recovery) ──────
        function playStream(url, retry = false) {
            if (!url) {
                showNotification('No stream URL provided.', 2000);
                return;
            }

            // Clean up previous HLS/DASH instances
            destroyHls();

            currentChannelUrl = url;
            highlightCurrentChannel();
            showSpinner('Loading Stream…');

            // Helper: silent fail with retry
            const silentFail = () => {
                hideSpinner();
                player.pause();
                if (!retry) {
                    showNotification('⚠️ Unable to load stream. Trying again…', 2000);
                    setTimeout(() => playStream(url, true), 1500);
                } else {
                    showNotification('❌ Stream unavailable.', 2500);
                }
            };

            try {
                // HLS (.m3u8 / .ts)
                if (url.includes('.m3u8') || url.includes('.ts')) {
                    if (Hls.isSupported()) {
                        hlsInstance = new Hls({
                            enableWorker: false,
                            maxBufferLength: 30,
                            maxMaxBufferLength: 60,
                        });
                        hlsInstance.loadSource(url);
                        hlsInstance.attachMedia(player);

                        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                            player.play().then(() => {
                                isPlaying = true;
                                hideSpinner();
                                player.muted = false;
                                updatePlayPauseIcon();
                            }).catch(silentFail);
                        });

                        // Error recovery (Phase 1)
                        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                            if (data.fatal) {
                                switch (data.type) {
                                    case Hls.ErrorTypes.NETWORK_ERROR:
                                        showNotification('🔁 Network error – retrying…', 1800);
                                        hlsInstance.startLoad();
                                        break;
                                    case Hls.ErrorTypes.MEDIA_ERROR:
                                        showNotification('🔁 Media error – recovering…', 1800);
                                        hlsInstance.recoverMediaError();
                                        break;
                                    default:
                                        silentFail();
                                        break;
                                }
                            } else {
                                // non-fatal: ignore or log
                            }
                        });
                    } else {
                        // fallback: native HLS
                        player.src = url;
                        player.oncanplay = () => {
                            player.play().then(() => { hideSpinner();
                                isPlaying = true;
                                updatePlayPauseIcon(); }).catch(silentFail);
                        };
                        player.onerror = silentFail;
                    }
                }
                // DASH (.mpd)
                else if (url.includes('.mpd')) {
                    dashPlayer = dashjs.MediaPlayer().create();
                    dashPlayer.initialize(player, url, true);
                    dashPlayer.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, () => {
                        player.play().then(() => {
                            hideSpinner();
                            isPlaying = true;
                            updatePlayPauseIcon();
                            player.muted = false;
                        }).catch(silentFail);
                    });
                    dashPlayer.on(dashjs.MediaPlayer.events.ERROR, silentFail);
                }
                // Direct MP4 / RTMP / etc.
                else if (url.includes('.mp4') || /^(http|https|rtmp):\/\//.test(url)) {
                    player.src = url;
                    player.oncanplay = () => {
                        player.play().then(() => {
                            hideSpinner();
                            isPlaying = true;
                            updatePlayPauseIcon();
                        }).catch(silentFail);
                    };
                    player.onerror = silentFail;
                } else {
                    silentFail();
                }
            } catch (e) {
                console.warn('playStream error:', e);
                silentFail();
            }
        }

        // ─── HIGHLIGHT CURRENT CHANNEL ──────────────────────────────
        function highlightCurrentChannel() {
            document.querySelectorAll('.channel-item, .favorite-item').forEach(el => {

        function updatePlayPauseIcon() {

        // ─── M3U PARSER ──────────────────────────────────────────────
        function parseM3U(content) {
            try {
                const lines = content.split('\n');
                const channels = [];
                let current = null;
                for (const line of lines) {
                    const l = line.trim();
                    if (l.startsWith('#EXTINF')) {
                        const nameMatch = l.match(/,(.+)$/);
                        const logoMatch = l.match(/tvg-logo="([^"]+)"/);
                        current = {
                            name: nameMatch ? nameMatch[1] : 'Unknown Channel',
                            logo: logoMatch ? logoMatch[1] : DEFAULT_LOGO,
                            url: '',
                        };
                    } else if (l && !l.startsWith('#') && current) {
                        current.url = l;
                        channels.push(current);
                        current = null;
                    }
                }
                allChannels = channels;
                filteredChannels = channels.slice();
                localStorage.setItem('lastPlaylist', JSON.stringify(channels));
                renderChannels();
                updatePagination();
                if (channels.length > 0) {
                    playStream(channels[0].url);
                }
                updatePlaylistBar();
                // Reset analysis
                analysisLast = { total: 0, online: 0, offline: 0, list: [], onlineList: [], offlineList: [] };
                analysisText.textContent = 'Total: 0 | Online: 0 | Offline: 0';
                analysisChart.style.display = 'none';
            } catch (e) {
                showNotification('❌ Failed to parse M3U playlist.', 3200);
            }
        }

        // ─── RENDER CHANNELS (DOM-node, XSS-safe) ────────────────────
        function renderChannels(list) {
            const source = list || filteredChannels;
            const start = (currentPage - 1) * CHANNELS_PER_PAGE;
            const end = Math.min(start + CHANNELS_PER_PAGE, source.length);
            const pageItems = source.slice(start, end);

            channelList.innerHTML = '';

            for (const ch of pageItems) {
                const btn = document.createElement('button');
                btn.className = 'channel-item';
                btn.setAttribute('data-url', ch.url);

                const isFav = favorites.some(f => f.url === ch.url);
                const isCur = ch.url === currentChannelUrl;
                if (isCur) btn.classList.add('playlist-current');
                if (isFav) btn.classList.add('playlist-favorite');

                // Logo
                const img = document.createElement('img');
                img.src = ch.logo || DEFAULT_LOGO;
                img.alt = ch.name || 'Channel';
                img.onerror = function() { this.src = DEFAULT_LOGO; };
                btn.appendChild(img);

                // Icon
                const icon = document.createElement('i');
                icon.className = 'fas fa-tv';
                btn.appendChild(icon);

                // Name (safe)
                const nameSpan = document.createElement('span');
                nameSpan.textContent = ch.name || 'Unknown';
                btn.appendChild(nameSpan);

                // Favorite heart
                const favWrap = document.createElement('span');
                favWrap.style.cssText = 'margin-left:auto;display:flex;align-items:center;';
                const heart = document.createElement('i');
                heart.className = 'fas fa-heart favorite-btn' + (isFav ? ' text-red' : '');
                heart.setAttribute('data-url', ch.url);
                heart.setAttribute('data-name', ch.name || '');
                heart.setAttribute('data-logo', ch.logo || DEFAULT_LOGO);
                favWrap.appendChild(heart);
                btn.appendChild(favWrap);

                // Events
                btn.addEventListener('click', () => playStream(ch.url));
                btn.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    showContextMenu(e, btn);
                });
                heart.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleFavorite(ch.url, ch.name || '', ch.logo || DEFAULT_LOGO);
                });

                channelList.appendChild(btn);
            }

            highlightCurrentChannel();
        }

        // ─── PAGINATION ──────────────────────────────────────────────
        function updatePagination() {
            const total = filteredChannels.length;
            totalPages = Math.max(1, Math.ceil(total / CHANNELS_PER_PAGE));
            if (currentPage > totalPages) currentPage = totalPages;
            pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
            prevPageBtn.disabled = currentPage === 1;
            nextPageBtn.disabled = currentPage === totalPages;

            // Favorites pagination
            favoritesPages = Math.max(1, Math.ceil(favorites.length / CHANNELS_PER_PAGE));
            if (favoritesPage > favoritesPages) favoritesPage = favoritesPages;
            favPageInfo.textContent = `Page ${favoritesPage} of ${favoritesPages}`;
            prevFavPageBtn.disabled = favoritesPage === 1;
            nextFavPageBtn.disabled = favoritesPage === favoritesPages;
        }

        function changePage(dir) {
            currentPage = Math.max(1, Math.min(currentPage + dir, totalPages));
            renderChannels();
        }

        function changeFavoritesPage(dir) {
            favoritesPage = Math.max(1, Math.min(favoritesPage + dir, favoritesPages));
            renderFavorites();
        }

        // ─── FAVORITES (XSS-safe) ────────────────────────────────────
        function toggleFavorite(url, name, logo) {
            const idx = favorites.findIndex(f => f.url === url);
            if (idx === -1) {
                favorites.push({ url, name: name || 'Unknown', logo: logo || DEFAULT_LOGO });
                showNotification('❤️ Added to favorites', 1500);
            } else {
                favorites.splice(idx, 1);
                showNotification('💔 Removed from favorites', 1500);
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderFavorites();
            renderChannels();
        }

                img.onerror = function() { this.src = DEFAULT_LOGO; };
                btn.appendChild(img);

                const icon = document.createElement('i');
                icon.className = 'fas fa-tv';
                btn.appendChild(icon);

                const nameSpan = document.createElement('span');
                nameSpan.textContent = f.name || 'Unknown';
                btn.appendChild(nameSpan);

                const wrap = document.createElement('span');
                wrap.style.cssText = 'margin-left:auto;display:flex;align-items:center;';
                const heart = document.createElement('i');
                heart.className = 'fas fa-heart favorite-btn text-red';
                heart.setAttribute('data-url', f.url);
                heart.setAttribute('data-name', f.name || '');
                heart.setAttribute('data-logo', f.logo || DEFAULT_LOGO);
                wrap.appendChild(heart);

                btn.addEventListener('click', () => playStream(f.url));
                btn.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    showContextMenu(e, btn);
                });

                    e.stopPropagation();

        // ─── HISTORY (XSS-safe) ──────────────────────────────────────
        function renderHistory() {
            historyList.innerHTML = '';
            if (!history.length) {
                const p = document.createElement('p');
                p.textContent = 'No history available.';
                historyList.appendChild(p);
                return;
            }

            for (let i = 0; i < history.length; i++) {
                const h = history[i];
                const btn = document.createElement('button');
                btn.className = 'history-item';
                btn.setAttribute('data-index', i);

                const label = document.createElement('span');
                label.className = 'history-label';
                let displayName = h.name || 'Unknown';
                if (h.type === 'url' && /^https?:\/\//.test(displayName)) {
                    displayName = shortenUrl(displayName);
                }
                const icon = document.createElement('i');
                icon.className = 'fas fa-' + (h.type === 'file' ? 'file' : 'link');
                label.appendChild(icon);
                label.appendChild(safeText(' ' + displayName));
                btn.appendChild(label);

                const actions = document.createElement('span');
                actions.style.cssText = 'margin-left:auto;display:flex;align-items:center;';

                const reload = document.createElement('i');
                reload.className = 'fas fa-redo action-btn';
                reload.title = 'Reload';
                reload.setAttribute('data-index', i);
                actions.appendChild(reload);

                const del = document.createElement('i');
                del.className = 'fas fa-trash delete-btn';
                del.title = 'Delete';
                del.setAttribute('data-index', i);
                actions.appendChild(del);

                btn.appendChild(actions);

                btn.addEventListener('click', () => loadHistoryItem(i));
                reload.addEventListener('click', (e) => { e.stopPropagation();
                    loadHistoryItem(i); });
                del.addEventListener('click', (e) => { e.stopPropagation();
                    deleteHistoryItem(i); });

                historyList.appendChild(btn);
            }

            // Delete all button
            const bar = document.createElement('div');
            bar.className = 'history-list-bar';
            const delAll = document.createElement('button');
            delAll.textContent = '🗑️ Delete All';
            delAll.addEventListener('click', deleteAllHistory);
            bar.appendChild(delAll);
            historyList.appendChild(bar);
        }

        function loadHistoryItem(index) {
            const item = history[index];
            if (!item) return;
            if (item.type === 'file' && item.content) {
                if (item.name && item.name.endsWith('.m3u')) {
                    parseM3U(item.content);
                } else if (item.name && item.name.endsWith('.json')) {
                    try {
                        const json = JSON.parse(item.content);
                        if (json.url) playStream(json.url);
                    } catch (_) {}
                } else if (item.name && item.name.endsWith('.txt')) {
                    if (item.content.trim()) playStream(item.content.trim());
                } else {
                    // fallback: try to play as URL
                    if (item.content.trim().startsWith('http')) playStream(item.content.trim());
                }
            } else if (item.type === 'url' && item.url) {
                if (item.url.endsWith('.m3u')) {
                    fetch(item.url).then(r => r.text()).then(parseM3U).catch(() => {});
                } else {
                    playStream(item.url);
                }
            }
        }

        function deleteHistoryItem(index) {
            history.splice(index, 1);
            localStorage.setItem('history', JSON.stringify(history));
            renderHistory();
            showNotification('History entry deleted.', 1800);
        }

        function deleteAllHistory() {
            if (!history.length) return;
            if (confirm('Delete all history?')) {
                history = [];
                localStorage.setItem('history', JSON.stringify(history));
                renderHistory();
                showNotification('All history deleted.', 2000);
            }
        }

        // ─── FILE / URL HANDLING ─────────────────────────────────────
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const content = ev.target.result;
                history.push({ type: 'file', name: file.name, content });
                localStorage.setItem('history', JSON.stringify(history));
                renderHistory();

                if (file.name.endsWith('.m3u')) {
                    parseM3U(content);
                    playlistName = file.name;
                    localStorage.setItem('playlistName', file.name);
                    updatePlaylistBar();
                } else if (file.name.endsWith('.json')) {
                    try {
                        const json = JSON.parse(content);
                        if (json.url) playStream(json.url);
                        else if (Array.isArray(json.channels)) {
                            allChannels = json.channels.map(ch => ({
                                name: ch.name || 'Unknown',
                                url: ch.url,
                                logo: ch.logo || DEFAULT_LOGO,
                            }));
                            filteredChannels = allChannels.slice();
                            localStorage.setItem('lastPlaylist', JSON.stringify(allChannels));
                            playlistName = file.name;
                            localStorage.setItem('playlistName', file.name);
                            renderChannels();
                            updatePagination();
                            if (allChannels.length) playStream(allChannels[0].url);
                            updatePlaylistBar();
                        }
                    } catch (_) {}
                } else if (file.name.endsWith('.txt')) {
                    if (content.trim()) playStream(content.trim());
                } else {
                    if (content.trim().startsWith('#EXTM3U') || content.includes('#EXTINF')) {
                        parseM3U(content);
                        playlistName = file.name;
                        localStorage.setItem('playlistName', file.name);
                        updatePlaylistBar();
                    } else {
                        try {
                            const json = JSON.parse(content);
                            if (json.url) playStream(json.url);
                        } catch {
                            if (content.trim().startsWith('http')) playStream(content.trim());
                        }
                    }
                }
                showNotification('File loaded successfully.', 2200);
                fileInput.value = '';
            };
            reader.readAsText(file);
        }

        function handleUrlLoad() {
            const url = urlInput.value.trim();
            if (!url) return;
            history.push({ type: 'url', name: url, url });
            localStorage.setItem('history', JSON.stringify(history));
            renderHistory();

            if (url.endsWith('.m3u')) {
                fetch(url).then(r => r.text()).then(txt => {
                    parseM3U(txt);
                    playlistName = url.split('/').pop() || url;
                    localStorage.setItem('playlistName', playlistName);
                    updatePlaylistBar();
                }).catch(() => {});
            } else if (url.endsWith('.json')) {
                fetch(url).then(r => r.json()).then(json => {
                    if (json.url) playStream(json.url);
                    else if (Array.isArray(json.channels)) {
                        allChannels = json.channels.map(ch => ({
                            name: ch.name || 'Unknown',
                            url: ch.url,
                            logo: ch.logo || DEFAULT_LOGO,
                        }));
                        filteredChannels = allChannels.slice();
                        localStorage.setItem('lastPlaylist', JSON.stringify(allChannels));
                        playlistName = url.split('/').pop() || url;
                        localStorage.setItem('playlistName', playlistName);
                        renderChannels();
                        updatePagination();
                        if (allChannels.length) playStream(allChannels[0].url);
                        updatePlaylistBar();
                    }
                }).catch(() => {});
            } else if (url.endsWith('.txt')) {
                fetch(url).then(r => r.text()).then(txt => {
                    if (txt.trim()) playStream(txt.trim());
                }).catch(() => {});
            } else {
                playStream(url);
            }
            showNotification('URL loaded.', 2000);
            urlInput.value = '';
        }

        // ─── SEARCH ──────────────────────────────────────────────────
        function handleSearch() {
            const q = searchInput.value.toLowerCase().trim();
            if (!q) {
                filteredChannels = allChannels.slice();
            } else {
                filteredChannels = allChannels.filter(ch =>
                    ch.name.toLowerCase().includes(q)
                );
            }
            currentPage = 1;
            renderChannels();
            updatePagination();
        }

        // ─── CONTEXT MENU ────────────────────────────────────────────
        function showContextMenu(e, btn) {
            contextMenuChannel = btn;
            contextMenu.style.display = 'block';
            contextMenu.style.left = e.pageX + 'px';
            contextMenu.style.top = e.pageY + 'px';

                '<i class="fas fa-heart-broken"></i> Remove from Favorites' :
                '<i class="fas fa-heart"></i> Add to Favorites';

        function hideContextMenu() {
            contextMenu.style.display = 'none';
            contextMenuChannel = null;
        }

        function handleContextPlay() {
            if (contextMenuChannel) playStream(contextMenuChannel.getAttribute('data-url'));
            hideContextMenu();
        }

        function handleContextFavorite() {
            if (contextMenuChannel) {
                const url = contextMenuChannel.getAttribute('data-url');
                const name = contextMenuChannel.querySelector('span')?.textContent || 'Unknown';
                const logo = contextMenuChannel.querySelector('img')?.src || DEFAULT_LOGO;
                toggleFavorite(url, name, logo);

        function handleContextInfo() {
            if (contextMenuChannel) {
                const url = contextMenuChannel.getAttribute('data-url');
                const name = contextMenuChannel.querySelector('span')?.textContent || 'Unknown';
                showNotification('📺 ' + name + '<br>🔗 ' + shortenUrl(url), 4000);
            }
            hideContextMenu();
        }

        // ─── PLAYER CONTROLS ─────────────────────────────────────────
        function playPreviousChannel() {
            const list = filteredChannels.length ? filteredChannels : allChannels;
            const idx = list.findIndex(ch => ch.url === currentChannelUrl);
            if (idx > 0) {
                playStream(list[idx - 1].url);
                showNotification('⏪ ' + list[idx - 1].name, 1500);
            } else {
                showNotification('Already at first channel.', 1200);
            }
        }

        function playNextChannel() {
            const list = filteredChannels.length ? filteredChannels : allChannels;
            const idx = list.findIndex(ch => ch.url === currentChannelUrl);
            if (idx < list.length - 1 && idx !== -1) {
                playStream(list[idx + 1].url);
                showNotification('⏩ ' + list[idx + 1].name, 1500);
            } else {
                showNotification('Already at last channel.', 1200);
            }
        }

        function togglePlayPause() {
            if (player.paused) {
                player.play().then(() => { isPlaying = true;
                    updatePlayPauseIcon(); }).catch(() => {});
            } else {
                player.pause();
                isPlaying = false;
                updatePlayPauseIcon();
            }
        }

        function volumeUp() {
            player.volume = Math.min(1, player.volume + 0.1);
            showNotification('🔊 Volume: ' + Math.round(player.volume * 100) + '%', 1200);
        }

        function volumeDown() {
            player.volume = Math.max(0, player.volume - 0.1);
            showNotification('🔉 Volume: ' + Math.round(player.volume * 100) + '%', 1200);
        }

        // ─── FULLSCREEN (event-driven sync, Phase 3) ────────────────
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                player.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function updateFullscreenIcon() {
            const isFs = !!document.fullscreenElement;
            fullscreenBtn.innerHTML = isFs ?
                '<i class="fas fa-compress"></i>' :
                '<i class="fas fa-expand"></i>';
        }

        // ─── ANALYSIS (real health checks, Phase 2) ──────────────────
        async function runHealthChecks() {
            if (analysisInProgress) return;
            analysisInProgress = true;
            analysisText.textContent = '🔄 Checking streams…';
            analysisChart.style.display = 'block';

            const list = allChannels.length ? allChannels : [];
            if (!list.length) {
                analysisText.textContent = 'No playlist loaded.';
                analysisChart.style.display = 'none';
                analysisLast = { total: 0, online: 0, offline: 0, list: [], onlineList: [], offlineList: [] };
                analysisInProgress = false;
                return;
            }

            const online = [];
            const offline = [];

            // Check each channel with a lightweight fetch (no-cors)
            for (const ch of list) {
                try {
                    const resp = await fetch(ch.url, {
                        method: 'HEAD',
                        mode: 'no-cors',
                        cache: 'no-store',
                        signal: AbortSignal.timeout(5000),
                    });
                    // With no-cors, response is opaque; we treat as "reachable" if we got any response
                    online.push(ch);
                } catch (_) {
                    offline.push(ch);
                }
            }

            analysisLast = {
                total: list.length,
                online: online.length,
                offline: offline.length,
                list: list,
                onlineList: online,
                offlineList: offline,
            };

            analysisText.textContent =
                'Total: ' + list.length + ' | Online: ' + online.length + ' | Offline: ' + offline.length;
            drawChart(online.length, offline.length);
            updateAnalysisList();
            analysisInProgress = false;
        }

        function drawChart(online, offline) {
            const ctx = analysisChart.getContext('2d');
            const w = analysisChart.width,
                h = analysisChart.height;
            ctx.clearRect(0, 0, w, h);
            const cx = w / 2,
                cy = h / 2,
                r = Math.min(cx, cy) - 10;
            const total = online + offline || 1;
            const onlineAngle = (online / total) * 2 * Math.PI;

            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, onlineAngle, false);
            ctx.lineTo(cx, cy);
            ctx.fillStyle = '#28a745';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(cx, cy, r, onlineAngle, 2 * Math.PI, false);
            ctx.lineTo(cx, cy);
            ctx.fillStyle = '#dc3545';
            ctx.fill();
        }

        function switchAnalysisMode(mode) {
            analysisMode = mode;
            document.querySelectorAll('.analysis-buttons button').forEach(b => b.classList.remove('active'));
            if (mode === 'total') document.getElementById('showTotal').classList.add('active');
            else if (mode === 'online') document.getElementById('showOnline').classList.add('active');
            else if (mode === 'offline') document.getElementById('showOffline').classList.add('active');
            updateAnalysisList();
        }

        function updateAnalysisList() {
            let list = [];
            if (analysisMode === 'total') list = analysisLast.list || [];
            else if (analysisMode === 'online') list = analysisLast.onlineList || [];
            else if (analysisMode === 'offline') list = analysisLast.offlineList || [];
            currentPage = 1;
            filteredChannels = list.length ? list : [];
            renderChannels();
            updatePagination();
        }

        function refreshAnalysisTab() {
            if (analysisLast.total === 0 && allChannels.length > 0) {
                analysisText.textContent = 'Click the check icon to check status.';
                analysisChart.style.display = 'none';
            } else {
                analysisText.textContent =
                    'Total: ' + analysisLast.total + ' | Online: ' + analysisLast.online + ' | Offline: ' + analysisLast
                    .offline;
                analysisChart.style.display = analysisLast.total ? 'block' : 'none';
                if (analysisLast.total) drawChart(analysisLast.online, analysisLast.offline);
                updateAnalysisList();
            }
        }

        // ─── INTELLIGENT WHEEL SCROLL (Phase 3) ──────────────────────
        function setupWheelScrolling() {
            const containers = [channelList, favoritesList, historyList, sidebar];
            for (const el of containers) {
                if (!el) continue;
                el.addEventListener('wheel', function(ev) {
                    const atTop = this.scrollTop === 0 && ev.deltaY < 0;
                    const atBottom = this.scrollTop + this.clientHeight >= this.scrollHeight && ev.deltaY > 0;
                    if (atTop || atBottom) {
                        // Let the event bubble to window scroll
                        return;
                    }
                    ev.preventDefault();
                    // Scroll the container itself
                    this.scrollBy({ top: ev.deltaY, behavior: 'auto' });
                }, { passive: false });
            }
        }

        // ─── KEYBOARD ─────────────────────────────────────────────────
        function handleKeyboard(e) {
            if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
            switch (e.key) {
                case 'ArrowRight':
                    e.preventDefault();
                    playNextChannel();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    playPreviousChannel();
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    volumeUp();
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    volumeDown();
                    break;
                case ' ':
                    e.preventDefault();
                    togglePlayPause();
                    break;
                case 'f':
                case 'F':
                    e.preventDefault();
                    toggleFullscreen();
                    break;
                case 'Escape':
                    if (document.fullscreenElement) {
                        document.exitFullscreen().catch(() => {});
                    }
                    break;
            }
        }

        // ─── LOAD DEFAULT ─────────────────────────────────────────────
        function loadDefaultPlaylist() {
            const stored = localStorage.getItem('lastPlaylist');
            if (stored) {
                try {
                    allChannels = JSON.parse(stored);
                    filteredChannels = allChannels.slice();
                    renderChannels();
                    updatePagination();
                    if (allChannels.length) playStream(allChannels[0].url);
                    updatePlaylistBar();
                    return;
                } catch (_) {}
            }
            parseM3U(DEFAULT_PLAYLIST);
            playlistName = 'Default Playlist';
            localStorage.setItem('playlistName', playlistName);
            updatePlaylistBar();
        }

        // ─── INIT ─────────────────────────────────────────────────────
        function init() {
            // Time
            updateLocalTime();
            setInterval(updateLocalTime, 1000);

            // Footer
            updateFooter();

            // Theme
            setTheme(getThemePref());

            // Sidebar visible
            setSidebarVisible(true);

            // Fullscreen sync (Phase 3)
            document.addEventListener('fullscreenchange', updateFullscreenIcon);

            // Wheel scrolling
            setupWheelScrolling();

            // Load playlist
            loadDefaultPlaylist();

            // Render history & favorites
            renderHistory();
            renderFavorites();

            // ─── EVENT BINDING ──────────────────────────────────────

            // Theme
            toggleThemeBtn.addEventListener('click', toggleTheme);

            // Sidebar
            toggleSidebarBtn.addEventListener('click', toggleSidebar);

            // Tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => switchTab(tab.dataset.tab));
            });

            // Analysis buttons
            document.getElementById('showTotal').addEventListener('click', () => switchAnalysisMode('total'));
            document.getElementById('showOnline').addEventListener('click', () => switchAnalysisMode('online'));
            document.getElementById('showOffline').addEventListener('click', () => switchAnalysisMode('offline'));

            // Manual check
            manualCheckBtn.addEventListener('click', runHealthChecks);

            // File upload
            fileInput.addEventListener('change', handleFileUpload);

            // URL load
            loadUrlBtn.addEventListener('click', handleUrlLoad);
            urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleUrlLoad(); });

            // Search
            searchInput.addEventListener('input', handleSearch);

            // Pagination
            prevPageBtn.addEventListener('click', () => changePage(-1));
            nextPageBtn.addEventListener('click', () => changePage(1));
            prevFavPageBtn.addEventListener('click', () => changeFavoritesPage(-1));
            nextFavPageBtn.addEventListener('click', () => changeFavoritesPage(1));

            // Context menu
            contextPlay.addEventListener('click', handleContextPlay);
            contextFavorite.addEventListener('click', handleContextFavorite);
            contextInfo.addEventListener('click', handleContextInfo);
            document.addEventListener('click', hideContextMenu);
            document.addEventListener('contextmenu', (e) => {
                if (!e.target.closest('.channel-item') && !e.target.closest('.favorite-item')) {
                    hideContextMenu();
                }
            });

            // Player controls
            prevChannelBtn.addEventListener('click', playPreviousChannel);
            nextChannelBtn.addEventListener('click', playNextChannel);
            playPauseBtn.addEventListener('click', togglePlayPause);
            volumeUpBtn.addEventListener('click', volumeUp);
            volumeDownBtn.addEventListener('click', volumeDown);
            fullscreenBtn.addEventListener('click', toggleFullscreen);

            // Keyboard
            document.addEventListener('keydown', handleKeyboard);

            // Player events: update play/pause state
            player.addEventListener('play', () => { isPlaying = true;
                updatePlayPauseIcon(); });
            player.addEventListener('pause', () => { isPlaying = false;
                updatePlayPauseIcon(); });
            player.addEventListener('ended', () => { isPlaying = false;
                updatePlayPauseIcon(); });

            console.log('✅ Project Resilience — IPTV Player rebuilt.');
        }

        // ─── START ────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
