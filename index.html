<style>
:root {
--bg: #0a0a0a;
--bg-secondary: #0f0f0f;
--bar: rgba(26, 26, 26, 0.95);
--accent: #ff4500;
--accent-glow: rgba(255, 69, 0, 0.38);
--accent-light: #ffaa44;
--text: #e8e8e8;
--text-secondary: #aaa;
--border: #2e2e2e;
--border-light: #3a3a3a;
--card: #141414;
--card-hover: #1e1e1e;
--success: #00cc66;
--warning: #ffaa00;
--popout-bg: rgba(255, 215, 0, 0.22);
--popout-hover: rgba(255, 215, 0, 0.45);
--popout-text: #ffeb3b;
}

* { box-sizing: border-box; }

body {
margin: 0;
background: var(--bg);
color: var(--text);
font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
line-height: 1.5;
overflow-x: hidden;
}

#remote-bar {
position: fixed;
top: 0;
left: 0;
right: 0;
background: var(--bar);
backdrop-filter: blur(12px) saturate(180%);
-webkit-backdrop-filter: blur(12px) saturate(180%);
padding: 14px 20px;
display: flex;
flex-wrap: wrap;
gap: 10px;
align-items: center;
z-index: 9999;
border-bottom: 1px solid var(--border);
box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}

button, select, input {
padding: 10px 15px;
font-size: 14px;
border-radius: 8px;
border: 1px solid var(--border-light);
background: #1f1f1f;
color: inherit;
cursor: pointer;
transition: all 0.22s ease;
font-family: inherit;
font-weight: 500;
}

button:hover:not(:disabled) {
transform: translateY(-2px);
border-color: var(--accent);
box-shadow: 0 4px 12px var(--accent-glow);
}

button:active {
transform: translateY(0);
}

button:disabled {
opacity: 0.4;
cursor: not-allowed;
}

#pop-out {
background: var(--popout-bg);
color: var(--popout-text);
border-color: rgba(255,215,0,0.35);
font-weight: 600;
}

#pop-out:hover {
background: var(--popout-hover);
box-shadow: 0 0 18px rgba(255,215,0,0.5);
}

select, input[type="text"] {
min-width: 160px;
}

.search-wrapper {
position: relative;
display: inline-block;
}

#search-input {
padding-right: 36px;
width: 220px;
background: #1a1a1a;
border-color: var(--border);
}

#search-input:focus {
outline: none;
border-color: var(--accent);
box-shadow: 0 0 8px var(--accent-glow);
}

#clear-search {
position: absolute;
right: 40px;
top: 50%;
transform: translateY(-50%);
background: transparent;
border: none;
color: #888;
font-size: 16px;
cursor: pointer;
display: none;
padding: 0;
width: 24px;
height: 24px;
}

#clear-search:hover {
color: white;
}

#page-frame {
display: none;
width: 100%;
height: 100vh;
border: none;
background: #000;
padding-top: 70px;
box-sizing: border-box;
}

#content-hub {
padding: 90px 30px 50px;
max-width: 1520px;
margin: 0 auto;
}

h1 {
text-align: center;
color: var(--accent);
font-size: 2.8rem;
margin: 0 0 8px;
font-weight: 700;
letter-spacing: -0.5px;
}

.subtitle {
text-align: center;
color: var(--text-secondary);
margin-bottom: 40px;
font-size: 1rem;
font-weight: 500;
letter-spacing: 0.3px;
}

details {
margin: 28px 0;
border: 1px solid var(--border);
border-radius: 12px;
overflow: hidden;
background: var(--card);
}

details[open] {
background: var(--card-hover);
}

summary {
padding: 18px 24px;
background: #181818;
font-size: 1.3rem;
font-weight: 600;
color: var(--accent);
cursor: pointer;
user-select: none;
display: flex;
align-items: center;
gap: 12px;
transition: all 0.22s ease;
}

summary:hover {
background: #1e1e1e;
padding-left: 28px;
}

summary::marker {
color: var(--accent);
}

.category-badge {
display: inline-block;
background: rgba(255, 69, 0, 0.15);
color: var(--accent-light);
padding: 3px 10px;
border-radius: 6px;
font-size: 0.85rem;
font-weight: 600;
margin-left: auto;
}

.grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
gap: 18px;
padding: 24px;
}

@media (max-width: 1200px) {
.grid {
grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
}
}

@media (max-width: 768px) {
.grid {
grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
gap: 14px;
padding: 16px;
}
}

.item {
position: relative;
background: #1a1a1a;
padding: 20px;
border-radius: 12px;
border: 1px solid #2a2a2a;
transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
display: flex;
flex-direction: column;
}

.item:hover {
transform: translateY(-6px);
border-color: var(--accent);
box-shadow: 0 12px 32px rgba(255, 69, 0, 0.18);
background: #222;
}

.item.active {
border-color: var(--accent);
box-shadow: 0 0 0 2px var(--accent), 0 12px 32px rgba(255, 69, 0, 0.28);
background: #1e1e1e;
transform: translateY(-3px);
}

.item-header {
display: flex;
align-items: flex-start;
gap: 12px;
margin-bottom: 8px;
}

.item i.thumb-icon {
font-size: 1.6rem;
color: var(--accent-light);
flex-shrink: 0;
width: 28px;
text-align: center;
}

.item-content {
flex: 1;
min-width: 0;
}

.item a {
color: var(--accent-light);
text-decoration: none;
font-weight: 600;
display: block;
margin-bottom: 8px;
line-height: 1.3;
word-break: break-word;
transition: color 0.2s ease;
}

.item a:hover {
color: #ffdd57;
}

.tags {
font-size: 0.78rem;
color: #777;
margin-top: 6px;
display: flex;
flex-wrap: wrap;
gap: 6px;
}

.tag {
background: rgba(255, 69, 0, 0.08);
padding: 2px 8px;
border-radius: 4px;
color: #aaa;
}

.star {
position: absolute;
top: 14px;
right: 14px;
font-size: 1.4rem;
cursor: pointer;
color: #555;
transition: all 0.2s;
z-index: 10;
line-height: 1;
}

.star:hover {
color: #ffdd57;
transform: scale(1.15);
}

.star.active i {
color: #ffdd57;
text-shadow: 0 0 10px rgba(255, 221, 87, 0.6);
}

.hidden { display: none !important; }

#fallback-notice {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.92);
display: none;
align-items: center;
justify-content: center;
z-index: 10000;
color: white;
text-align: center;
padding: 40px;
}

#fallback-notice div {
background: var(--card);
padding: 40px;
border-radius: 16px;
border: 1px solid var(--border);
max-width: 480px;
}

#fallback-notice h2 {
color: var(--accent);
margin-top: 0;
}

#fallback-notice button {
margin-top: 24px;
margin-right: 12px;
padding: 12px 28px;
font-size: 1rem;
background: var(--accent);
border: none;
border-radius: 8px;
color: white;
cursor: pointer;
font-weight: 600;
}

#fallback-notice button:last-child {
background: transparent;
border: 1px solid var(--border);
color: var(--text);
}

.iframe-loader {
display: none;
position: fixed;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
border: 4px solid rgba(255, 69, 0, 0.2);
border-top: 4px solid var(--accent);
border-radius: 50%;
width: 50px;
height: 50px;
animation: spin 1s linear infinite;
z-index: 10001;
}

@keyframes spin {
0% { transform: translate(-50%, -50%) rotate(0deg); }
100% { transform: translate(-50%, -50%) rotate(360deg); }
}

button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible, .star:focus-visible {
outline: 3px solid var(--accent);
outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
* {
animation-duration: 0.01ms !important;
animation-iteration-count: 1 !important;
transition-duration: 0.01ms !important;
}
}
</style>
</head>

return 'general';

// ----- ORGANIZE ITEMS -----
const organized = {};
for (const cat of Object.keys(categoryMap)) {
organized[cat] = [];
}

for (const item of catalog.items) {
const category = categorizeItem(item.domain, item.title);
organized[category].push(item);
}

// ----- RENDER SECTIONS -----
const hub = document.getElementById('dynamic-content');
for (const [catKey, items] of Object.entries(organized)) {
if (items.length === 0) continue;

const cat = categoryMap[catKey];
const details = document.createElement('details');
details.className = 'category-section';

const summary = document.createElement('summary');
summary.innerHTML = `<i class="${cat.icon}"></i> ${cat.label} <span class="category-badge">${items.length}</span>`;
details.appendChild(summary);

const grid = document.createElement('div');
grid.className = 'grid';

for (const item of items) {
const itemEl = document.createElement('div');
itemEl.className = 'item';
itemEl.innerHTML = `
<div class="item-header">
<i class="fas fa-play-circle thumb-icon"></i>
<div class="item-content">
<a href="javascript:void(0)" onclick="loadURL('${item.url.replace(/'/g, "\\'")}'); return false;">${item.title}</a>
</div>
<div class="star" onclick="toggleStar(this, '${item.url.replace(/'/g, "\\'")}', '${item.title.replace(/'/g, "\\'")}')" title="Add to favorites">
<i class="fas fa-star"></i>
</div>
</div>
<div class="tags">
<span class="tag">${item.domain}</span>
</div>
`;
grid.appendChild(itemEl);
}

details.appendChild(grid);
hub.appendChild(details);
}

// ----- KEYBOARD & HISTORY -----
const history = [];
let historyIndex = -1;

document.getElementById('home-btn').addEventListener('click', () => location.hash = '#');
document.getElementById('back-btn').addEventListener('click', () => {
if (historyIndex > 0) {
historyIndex--;
loadURL(history[historyIndex], false);
}
});
document.getElementById('fwd-btn').addEventListener('click', () => {
if (historyIndex < history.length - 1) {
historyIndex++;
loadURL(history[historyIndex], false);
}
});
document.getElementById('refresh-btn').addEventListener('click', () => location.reload());
document.getElementById('go-btn').addEventListener('click', () => {
const val = document.getElementById('page-menu').value;
if (val) loadURL(catalog.items.find(i => i.url.includes(val))?.url || '');
});

document.getElementById('search-input').addEventListener('input', (e) => {
const query = e.target.value.toLowerCase();
document.querySelectorAll('.category-section').forEach(section => {
let visible = 0;
section.querySelectorAll('.item').forEach(item => {
const match = item.textContent.toLowerCase().includes(query);
item.classList.toggle('hidden', !match);
if (match) visible++;
});
section.classList.toggle('hidden', visible === 0);
});
document.getElementById('clear-search').style.display = query ? 'block' : 'none';
});

document.getElementById('clear-search').addEventListener('click', () => {
document.getElementById('search-input').value = '';
document.getElementById('search-input').dispatchEvent(new Event('input'));
});

document.addEventListener('keydown', (e) => {
if (e.altKey) {
if (e.key === 'h') document.getElementById('home-btn').click();
if (e.key === 'r') document.getElementById('refresh-btn').click();
if (e.key === 'c') document.getElementById('clear-history-btn').click();
}
});

function loadURL(url, addToHistory = true) {
document.getElementById('page-frame').src = url;
document.getElementById('page-frame').style.display = 'block';
document.getElementById('content-hub').style.display = 'none';
document.getElementById('pop-out').classList.remove('hidden');

if (addToHistory) {
history.splice(historyIndex + 1);
history.push(url);
historyIndex = history.length - 1;
}

document.getElementById('back-btn').disabled = historyIndex <= 0;
document.getElementById('fwd-btn').disabled = historyIndex >= history.length - 1;
}

function openCurrentInTab() {
if (document.getElementById('page-frame').src) {
window.open(document.getElementById('page-frame').src, '_blank');
}
}

document.getElementById('pop-out').addEventListener('click', openCurrentInTab);

let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');

function toggleStar(el, url, title) {
const isActive = el.classList.toggle('active');
if (isActive) {
favorites.push({url, title});
} else {
favorites = favorites.filter(f => f.url !== url);
}
localStorage.setItem('favorites', JSON.stringify(favorites));
updateFavSection();
}

function updateFavSection() {
const favSection = document.getElementById('fav-section');
const favGrid = document.getElementById('fav-grid');
favGrid.innerHTML = '';

if (favorites.length === 0) {
favSection.classList.add('hidden');
return;
}

favSection.classList.remove('hidden');
document.getElementById('fav-count').textContent = favorites.length;

for (const fav of favorites) {
const item = document.createElement('div');
item.className = 'item active';
item.innerHTML = `
<div class="item-header">
<i class="fas fa-star thumb-icon" style="color: #ffdd57;"></i>
<div class="item-content">
<a href="javascript:void(0)" onclick="loadURL('${fav.url.replace(/'/g, "\\'")}'); return false;">${fav.title}</a>
</div>
<div class="star active" onclick="toggleStar(this, '${fav.url.replace(/'/g, "\\'")}', '${fav.title.replace(/'/g, "\\'")}')" title="Remove from favorites">
<i class="fas fa-star"></i>
</div>
</div>
`;
favGrid.appendChild(item);
}
}

updateFavSection();
document.querySelectorAll('.item').forEach(item => {
const url = item.querySelector('a').onclick.toString().match(/'([^']+)'/)[1];
if (favorites.some(f => f.url === url)) {
item.querySelector('.star').classList.add('active');
}
});
</script>
